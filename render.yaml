services:
  # Service Web Django
  - type: web
    name: fuegodelcorazon
    env: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn student_matching.wsgi:application
    healthCheckPath: /
    
    # Variables d'environnement
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: WEB_CONCURRENCY
        value: 1
      - key: DATABASE_URL
        fromDatabase:
          name: fuegodelcorazon-db
          property: connectionString
        
    # Configuration de la base de données PostgreSQL
    databases:
      - name: fuegodelcorazon-db
        databaseName: fuegodelcorazon
        user: fuegodelcorazon

# Service de base de données PostgreSQL
databases:
  - name: fuegodelcorazon-db
    databaseName: fuegodelcorazon
    user: fuegodelcorazon
    plan: free
