[build]
builder = "NIXPACKS"
buildCommand = "bash railway.sh"

[deploy]
startCommand = "gunicorn student_matching.wsgi:application"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/"
healthcheckTimeout = 300
replicaCount = 1

[env]
PYTHON_VERSION = "3.14"
PORT = "8000"

[[services]]
name = "web"
source = "."
[services.deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
